<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" font-family="Arial, sans-serif" font-size="12">
  <line x1="40" y1="240" x2="340" y2="240" stroke="#333" stroke-width="1.5"/>
  <line x1="40" y1="20" x2="40" y2="240" stroke="#333" stroke-width="1.5"/>
  <text x="345" y="245" font-weight="bold">L</text>
  <text x="20" y="15" font-weight="bold">K</text>
  <!-- 등비용선 (직선) -->
  <line x1="40" y1="50" x2="300" y2="240" stroke="#0a7" stroke-width="2.5"/>
  <text x="305" y="245" fill="#0a7" font-weight="bold">C₀</text>
  <text x="20" y="55" fill="#0a7" font-size="11">C/r</text>
  <text x="290" y="258" fill="#0a7" font-size="11">C/w</text>
  <!-- 등량곡선 Q₁ (원점에 볼록, 접점) -->
  <path d="M 80,200 Q 120,135 175,128 Q 250,125 290,80" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="295" y="80" fill="#2563eb" font-weight="bold">Q₁</text>
  <!-- 등량곡선 Q₀ (안쪽) -->
  <path d="M 70,225 Q 100,170 150,162 Q 200,155 240,118" fill="none" stroke="#93c5fd" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="245" y="115" fill="#3b82f6" font-size="11">Q₀</text>
  <!-- 등량곡선 Q₂ (바깥쪽) -->
  <path d="M 100,200 Q 145,115 215,108 Q 290,100 330,55" fill="none" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="2 3"/>
  <text x="325" y="55" fill="#60a5fa" font-size="11">Q₂</text>
  <!-- 비용 최소화점 -->
  <circle cx="175" cy="128" r="4.5" fill="#dc2626"/>
  <text x="183" y="125" font-weight="bold" fill="#dc2626">E</text>
  <text x="183" y="138" fill="#dc2626" font-size="10">MRTS=w/r</text>
  <line x1="175" y1="128" x2="175" y2="240" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="168" y="258" font-style="italic">L*</text>
  <line x1="40" y1="128" x2="175" y2="128" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="22" y="132" font-style="italic">K*</text>
  <text x="28" y="258">O</text>
</svg>
