<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" font-family="Arial, sans-serif" font-size="12">
  <line x1="40" y1="240" x2="340" y2="240" stroke="#333" stroke-width="1.5"/>
  <line x1="40" y1="20" x2="40" y2="240" stroke="#333" stroke-width="1.5"/>
  <text x="345" y="245" font-weight="bold">Q</text>
  <text x="20" y="15" font-weight="bold">P</text>
  <!-- 수요곡선 D (우하향, 평탄) -->
  <line x1="60" y1="40" x2="320" y2="220" stroke="#2563eb" stroke-width="2.5"/>
  <text x="325" y="225" fill="#2563eb" font-weight="bold">D</text>
  <!-- 한계수입 MR (수요보다 2배 가파름) -->
  <line x1="60" y1="40" x2="190" y2="220" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="195" y="225" fill="#7c3aed" font-weight="bold">MR</text>
  <!-- 한계비용 MC (수평 또는 약간 우상향) -->
  <line x1="60" y1="160" x2="320" y2="120" stroke="#dc2626" stroke-width="2.5"/>
  <text x="325" y="120" fill="#dc2626" font-weight="bold">MC</text>
  <!-- 평균비용 ATC -->
  <path d="M 60,200 Q 130,170 200,150 Q 270,135 320,140" fill="none" stroke="#0a7" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="325" y="145" fill="#0a7" font-size="11">ATC</text>
  <!-- 독점 산출 Qm (MR = MC) -->
  <line x1="140" y1="145" x2="140" y2="240" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="133" y="258">Qm</text>
  <!-- 독점 가격 Pm (수요곡선 위) -->
  <circle cx="140" cy="105" r="4" fill="#dc2626"/>
  <text x="147" y="105" fill="#dc2626" font-weight="bold">Pm</text>
  <line x1="40" y1="105" x2="140" y2="105" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="15" y="109">Pm</text>
  <!-- MC=MR 점 -->
  <circle cx="140" cy="145" r="3" fill="#dc2626"/>
  <!-- 완전경쟁 비교점 Pc (수요·MC 교점) -->
  <line x1="40" y1="138" x2="220" y2="138" stroke="#666" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text x="15" y="132" font-size="11">Pc</text>
  <!-- 사중손실 (수요-MC 사이 삼각형, Qm에서 완전경쟁 Q까지) -->
  <polygon points="140,105 140,145 220,138" fill="#fbbf24" fill-opacity="0.4" stroke="#f59e0b" stroke-width="1"/>
  <text x="155" y="125" fill="#b45309" font-size="10">DWL</text>
  <text x="28" y="258">O</text>
</svg>
