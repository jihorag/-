<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" font-family="Arial, sans-serif" font-size="12">
  <text x="180" y="30" font-weight="bold" text-anchor="middle">죄수의 딜레마 보수행렬</text>
  <text x="180" y="50" text-anchor="middle" font-size="11" fill="#666">(자백, 침묵 / A의 보수, B의 보수)</text>
  <rect x="50" y="80" width="120" height="40" fill="#e0e7ff" stroke="#333"/>
  <text x="110" y="105" text-anchor="middle" font-weight="bold">B 자백</text>
  <rect x="170" y="80" width="120" height="40" fill="#e0e7ff" stroke="#333"/>
  <text x="230" y="105" text-anchor="middle" font-weight="bold">B 침묵</text>
  <rect x="50" y="120" width="120" height="60" fill="#fef3c7" stroke="#333"/>
  <text x="50" y="145" text-anchor="middle" font-weight="bold" transform="rotate(-90 30 145)">A 자백</text>
  <text x="110" y="145" text-anchor="middle" fill="#dc2626" font-weight="bold">(-5, -5)</text>
  <text x="110" y="165" text-anchor="middle" font-size="10" fill="#666">내쉬균형</text>
  <rect x="170" y="120" width="120" height="60" fill="#fff" stroke="#333"/>
  <text x="230" y="155" text-anchor="middle" fill="#0a7" font-weight="bold">(0, -10)</text>
  <rect x="50" y="180" width="120" height="60" fill="#fff" stroke="#333"/>
  <text x="50" y="215" text-anchor="middle" font-weight="bold" transform="rotate(-90 30 215)">A 침묵</text>
  <text x="110" y="215" text-anchor="middle" fill="#0a7" font-weight="bold">(-10, 0)</text>
  <rect x="170" y="180" width="120" height="60" fill="#dcfce7" stroke="#333"/>
  <text x="230" y="210" text-anchor="middle" fill="#047857" font-weight="bold">(-1, -1)</text>
  <text x="230" y="228" text-anchor="middle" font-size="10" fill="#666">파레토 우월</text>
</svg>
