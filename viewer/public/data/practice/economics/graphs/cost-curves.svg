<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" font-family="Arial, sans-serif" font-size="12">
  <line x1="40" y1="240" x2="340" y2="240" stroke="#333" stroke-width="1.5"/>
  <line x1="40" y1="20" x2="40" y2="240" stroke="#333" stroke-width="1.5"/>
  <text x="345" y="245" font-weight="bold">Q</text>
  <text x="20" y="15" font-weight="bold">$</text>
  <!-- ATC (U자형) -->
  <path d="M 60,80 Q 130,180 200,140 Q 280,90 320,60" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="325" y="60" fill="#2563eb" font-weight="bold">ATC</text>
  <!-- AVC (U자형, ATC 아래) -->
  <path d="M 60,140 Q 130,210 200,180 Q 280,140 320,110" fill="none" stroke="#7c3aed" stroke-width="2.2"/>
  <text x="325" y="115" fill="#7c3aed" font-weight="bold">AVC</text>
  <!-- AFC (우하향) -->
  <path d="M 60,60 Q 150,160 240,210 Q 300,230 330,235" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="335" y="237" fill="#64748b" font-size="11">AFC</text>
  <!-- MC (U자형, AVC·ATC 극소점 통과) -->
  <path d="M 60,200 Q 110,150 165,165 Q 220,170 320,40" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="325" y="40" fill="#dc2626" font-weight="bold">MC</text>
  <!-- AVC 극소점 -->
  <circle cx="200" cy="180" r="3" fill="#7c3aed"/>
  <text x="180" y="200" fill="#7c3aed" font-size="10">조업중단점</text>
  <!-- ATC 극소점 -->
  <circle cx="240" cy="118" r="3" fill="#2563eb"/>
  <text x="245" y="115" fill="#2563eb" font-size="10">손익분기점</text>
  <text x="28" y="258">O</text>
</svg>
