<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" font-family="Arial, sans-serif" font-size="12">
  <!-- 축 -->
  <line x1="40" y1="240" x2="340" y2="240" stroke="#333" stroke-width="1.5"/>
  <line x1="40" y1="20" x2="40" y2="240" stroke="#333" stroke-width="1.5"/>
  <!-- X·Y 축 라벨 -->
  <text x="345" y="245" font-weight="bold">Q</text>
  <text x="20" y="15" font-weight="bold">P</text>
  <!-- 수요곡선 D (우하향): (60, 40) -> (320, 220) -->
  <line x1="60" y1="40" x2="320" y2="220" stroke="#2563eb" stroke-width="2.5"/>
  <text x="325" y="225" fill="#2563eb" font-weight="bold">D</text>
  <!-- 공급곡선 S (우상향): (60, 220) -> (320, 40) -->
  <line x1="60" y1="220" x2="320" y2="40" stroke="#dc2626" stroke-width="2.5"/>
  <text x="325" y="45" fill="#dc2626" font-weight="bold">S</text>
  <!-- 균형점 E -->
  <circle cx="190" cy="130" r="4" fill="#111"/>
  <text x="198" y="128" font-weight="bold">E</text>
  <!-- 균형 가격 P* -->
  <line x1="40" y1="130" x2="190" y2="130" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="10" y="134" font-style="italic">P*</text>
  <!-- 균형 거래량 Q* -->
  <line x1="190" y1="130" x2="190" y2="240" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="183" y="258" font-style="italic">Q*</text>
  <!-- 원점 -->
  <text x="28" y="258">O</text>
</svg>
