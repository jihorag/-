<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" font-family="Arial, sans-serif" font-size="12">
  <line x1="40" y1="240" x2="340" y2="240" stroke="#333" stroke-width="1.5"/>
  <line x1="40" y1="20" x2="40" y2="240" stroke="#333" stroke-width="1.5"/>
  <text x="345" y="245" font-weight="bold">X재</text>
  <text x="20" y="15" font-weight="bold">Y재</text>
  <!-- PPC (원점에 오목한 곡선) -->
  <path d="M 40,60 Q 100,75 180,120 Q 240,160 300,240" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="270" y="65" fill="#2563eb" font-weight="bold">PPC</text>
  <!-- 절편 라벨 -->
  <text x="20" y="65" font-style="italic">Y_max</text>
  <text x="285" y="258" font-style="italic">X_max</text>
  <!-- 효율점 A (PPC 위) -->
  <circle cx="180" cy="120" r="4" fill="#0a7"/>
  <text x="187" y="118" fill="#0a7" font-weight="bold">A</text>
  <text x="187" y="130" fill="#0a7" font-size="10">효율</text>
  <!-- 비효율점 B (PPC 내부) -->
  <circle cx="130" cy="180" r="4" fill="#f59e0b"/>
  <text x="137" y="183" fill="#b45309" font-weight="bold">B</text>
  <text x="137" y="195" fill="#b45309" font-size="10">비효율</text>
  <!-- 도달불가점 C (PPC 외부) -->
  <circle cx="260" cy="80" r="4" fill="#dc2626"/>
  <text x="267" y="80" fill="#dc2626" font-weight="bold">C</text>
  <text x="265" y="95" fill="#dc2626" font-size="10">도달불가</text>
  <text x="28" y="258">O</text>
</svg>
