<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" font-family="Arial, sans-serif" font-size="12">
  <line x1="40" y1="240" x2="340" y2="240" stroke="#333" stroke-width="1.5"/>
  <line x1="40" y1="20" x2="40" y2="240" stroke="#333" stroke-width="1.5"/>
  <text x="345" y="245" font-weight="bold">Q</text>
  <text x="20" y="15" font-weight="bold">P</text>
  <!-- 수요곡선 D -->
  <line x1="60" y1="40" x2="320" y2="220" stroke="#2563eb" stroke-width="2.5"/>
  <text x="325" y="225" fill="#2563eb" font-weight="bold">D</text>
  <!-- 원 공급곡선 S -->
  <line x1="60" y1="220" x2="320" y2="40" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="325" y="45" fill="#dc2626">S</text>
  <!-- 세후 공급곡선 S+t (위로 이동) -->
  <line x1="60" y1="180" x2="320" y2="0" stroke="#dc2626" stroke-width="2.5"/>
  <text x="325" y="5" fill="#dc2626" font-weight="bold">S+t</text>
  <!-- 원 균형 E0 -->
  <circle cx="190" cy="130" r="3.5" fill="#666"/>
  <text x="195" y="135" fill="#666">E₀</text>
  <!-- 세후 균형 E1 (소비자가 지불) -->
  <circle cx="160" cy="110" r="4" fill="#111"/>
  <text x="167" y="108" font-weight="bold">E₁</text>
  <!-- Pc (소비자 지불) -->
  <line x1="40" y1="110" x2="160" y2="110" stroke="#0a7" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="8" y="114" fill="#0a7" font-weight="bold">Pc</text>
  <!-- Pp (생산자 수취) -->
  <line x1="40" y1="150" x2="160" y2="150" stroke="#7a0" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="8" y="154" fill="#7a0" font-weight="bold">Pp</text>
  <!-- 세액 t (Pc - Pp) -->
  <line x1="155" y1="110" x2="155" y2="150" stroke="#111" stroke-width="2"/>
  <text x="120" y="135" font-weight="bold">t</text>
  <!-- 세후 거래량 Q1 -->
  <line x1="160" y1="150" x2="160" y2="240" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="153" y="258" font-style="italic">Q₁</text>
  <!-- 원 거래량 Q0 -->
  <text x="183" y="258" fill="#666" font-style="italic">Q₀</text>
  <line x1="190" y1="130" x2="190" y2="240" stroke="#666" stroke-width="0.8" stroke-dasharray="3 3"/>
  <!-- 사중손실 영역 (삼각형, 음영) -->
  <polygon points="160,110 190,130 160,150" fill="#fbbf24" fill-opacity="0.5" stroke="#f59e0b"/>
  <text x="200" y="100" fill="#b45309" font-size="11">사중손실</text>
  <text x="28" y="258">O</text>
</svg>
