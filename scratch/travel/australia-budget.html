<title>호주여행 예산.xlsx — 시드니·멜버른·골드코스트 (6/25–7/9)</title>
<style>
  :root{
    --bg:#f3f3f3; --panel:#fff; --grid:#d4d4d4; --grid-strong:#b0b0b0;
    --header-bg:#f9fafb; --col-bg:#e7eaed; --row-bg:#e7eaed;
    --sel:#1a73e8; --sel-bg:#e8f0fe; --sel-soft:#c7d8f7;
    --ribbon:#217346; --ribbon-dark:#185a36;
    --text:#202124; --muted:#5f6368;
  }
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size:13px;}
  .ribbon{background:var(--ribbon);color:#fff;padding:6px 12px;display:flex;align-items:center;gap:10px;
    border-bottom:2px solid var(--ribbon-dark);font-size:12px;}
  .ribbon .title{font-weight:600;letter-spacing:.2px}
  .ribbon .menu{display:flex;gap:14px;opacity:.95}
  .ribbon .menu span{cursor:default;padding:2px 6px;border-radius:3px}
  .ribbon .menu span:hover{background:rgba(255,255,255,.12)}
  .ribbon .spacer{flex:1}
  .ribbon button{background:#fff;color:var(--ribbon-dark);border:none;border-radius:3px;
    padding:3px 10px;font-size:12px;cursor:pointer;font-weight:600}
  .ribbon button.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
  .ribbon button:hover{filter:brightness(.96)}

  /* formula bar */
  .formula{display:flex;align-items:center;background:#fff;border-bottom:1px solid var(--grid-strong);
    padding:3px 6px;gap:6px;font-family:"Consolas","Menlo",monospace;font-size:12px;}
  .formula .namebox{min-width:90px;border:1px solid var(--grid);padding:2px 8px;border-radius:2px;background:#fff;font-weight:600;color:#202124}
  .formula .fx{color:#888;font-style:italic;width:18px;text-align:center;border-right:1px solid var(--grid);padding-right:6px}
  .formula .input{flex:1;border:1px solid var(--grid);padding:2px 6px;background:#fff;min-height:18px;color:#202124;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* toolbar (cheat strip) */
  .toolbar{background:#f1f3f4;border-bottom:1px solid var(--grid-strong);
    padding:4px 8px;display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted)}
  .toolbar .group{display:flex;gap:6px;align-items:center}
  .toolbar input[type=number]{width:64px;border:1px solid var(--grid);border-radius:2px;padding:2px 4px;font-family:inherit;font-size:12px;text-align:right}
  .toolbar .kbd{font-family:"Consolas",monospace;background:#fff;border:1px solid var(--grid);border-bottom-width:2px;border-radius:3px;padding:0 4px;font-size:11px}

  /* sheet area */
  .sheet-wrap{height:calc(100vh - 122px);overflow:auto;background:var(--bg);position:relative}
  table.sheet{border-collapse:separate;border-spacing:0;background:#fff;table-layout:fixed;}
  table.sheet td, table.sheet th{
    border-right:1px solid var(--grid); border-bottom:1px solid var(--grid);
    padding:0; height:22px; vertical-align:middle; overflow:hidden; white-space:nowrap;
  }
  /* corner */
  table.sheet thead th.corner{
    background:linear-gradient(135deg, #eceff1 50%, #cfd2d4 50%);
    position:sticky;top:0;left:0;z-index:5;width:38px;
    border-right:1px solid var(--grid-strong); border-bottom:1px solid var(--grid-strong);
  }
  /* column letters */
  table.sheet thead th.col{
    background:var(--col-bg); text-align:center; font-weight:500; color:#444;
    position:sticky; top:0; z-index:3; border-bottom:1px solid var(--grid-strong);
    font-size:11px; user-select:none;
  }
  /* row numbers */
  table.sheet td.row{
    background:var(--row-bg); text-align:center; font-weight:500; color:#444;
    position:sticky; left:0; z-index:2; border-right:1px solid var(--grid-strong);
    font-size:11px; user-select:none; width:38px;
  }
  /* cells */
  table.sheet td.cell{padding:2px 6px;cursor:cell;background:#fff;}
  table.sheet td.cell.num{text-align:right;font-variant-numeric:tabular-nums;font-family:"Segoe UI",sans-serif}
  table.sheet td.cell.center{text-align:center}
  table.sheet td.cell.bold{font-weight:600}
  table.sheet td.cell.hdr{background:#fafafa;font-weight:600;border-bottom:2px solid #888;text-align:center;color:#202124}
  table.sheet td.cell.section{background:#fff2cc;font-weight:700;color:#7f6000}
  table.sheet td.cell.total{background:#d9ead3;font-weight:700;border-top:2px solid #6aa84f;border-bottom:2px solid #6aa84f;}
  table.sheet td.cell.grand{background:#fce5cd;font-weight:700;border-top:3px double #cc4125;border-bottom:3px double #cc4125;color:#cc4125}
  table.sheet td.cell.muted{color:#888;font-size:11.5px}
  table.sheet td.cell.dimmed{background:#f6f6f6}
  table.sheet td.cell.formula{background:#eef7fc}
  table.sheet td.cell.selected{outline:2px solid var(--sel);outline-offset:-2px;background:var(--sel-bg)!important;z-index:1;position:relative}
  table.sheet td.cell input{
    width:100%;height:100%;border:none;background:transparent;outline:none;
    padding:0;font:inherit;color:inherit;text-align:inherit;font-variant-numeric:tabular-nums;
  }
  table.sheet td.cell input[type=checkbox]{width:14px;height:14px;cursor:pointer}
  table.sheet td.cell.note{color:#222}

  /* color tags */
  .tag-syd{background:#cfe2f3 !important}
  .tag-mel{background:#d9d2e9 !important}
  .tag-gc {background:#fff2cc !important}
  .tag-pre{background:#d9ead3 !important}
  .tag-move{background:#f4cccc !important}

  /* sheet tabs */
  .tabbar{background:#f1f3f4;border-top:1px solid var(--grid-strong);display:flex;align-items:end;gap:0;
    padding:0 6px;height:30px;overflow-x:auto;position:sticky;bottom:0}
  .tabbar .tab{padding:5px 14px;font-size:12px;background:#e3e5e8;color:#444;
    border:1px solid var(--grid-strong);border-bottom:none;border-radius:0 0 4px 4px;cursor:pointer;
    margin-top:4px;white-space:nowrap;display:flex;align-items:center;gap:5px}
  .tabbar .tab.active{background:#fff;color:#185a36;font-weight:600;margin-top:0;padding-top:9px;border-top:3px solid var(--ribbon)}
  .tabbar .tab .dot{width:8px;height:8px;border-radius:50%}
  .dot-pre{background:#6aa84f}.dot-syd{background:#3d85c6}.dot-mel{background:#8e7cc3}
  .dot-gc{background:#e69138}.dot-iti{background:#666}.dot-sum{background:#cc4125}.dot-chk{background:#999}

  /* status bar */
  .status{background:#f1f3f4;border-top:1px solid var(--grid-strong);padding:3px 12px;
    display:flex;justify-content:space-between;font-size:11px;color:var(--muted);height:22px;align-items:center}
  .status .right{display:flex;gap:18px}
  .status .pill{background:#fff;border:1px solid var(--grid);padding:1px 8px;border-radius:3px;font-variant-numeric:tabular-nums}

  /* widths */
  col.w-a{width:38px}
  col.w-b{width:200px}
  col.w-c{width:300px}
  col.w-d{width:100px}
  col.w-e{width:70px}
  col.w-f{width:120px}
  col.w-g{width:120px}
  col.w-h{width:70px}
  col.w-i{width:90px}
  col.w-j{width:90px}

  .pane{display:none}
  .pane.active{display:block}

  /* charts in summary */
  .chart-card{background:#fff;border:1px solid var(--grid-strong);padding:10px;margin:8px}
  .chart-card h4{margin:0 0 6px;font-size:12px;color:#444}

  ::selection{background:var(--sel-soft)}
</style>
</head>

const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const fmt=(n)=>Math.round(n).toLocaleString("ko-KR");
const fmtKRW=(n)=>"₩"+fmt(n);
const fmtAUD=(n)=>"A$"+(Math.round(n*100)/100).toLocaleString("en-AU",{minimumFractionDigits:0,maximumFractionDigits:2});
const COL = (i)=>{ // 0->A, 25->Z, 26->AA
  let s=""; i=i+1;
  while(i>0){ const r=(i-1)%26; s=String.fromCharCode(65+r)+s; i=Math.floor((i-1)/26); }
  return s;
};
function tableTotal(city){
  return state.tables[city].reduce((a,r)=>{
    if(r[0]==="__SEC__") return a;
    const v=(+r[2]||0)*(+r[3]||0);
    if(city==="pre") a.krw+=v; else a.aud+=v;
    return a;
  },{aud:0,krw:0});
}
function categoryTotals(){
  const t={};
  for(const [city,rows] of Object.entries(state.tables)){
    for(const r of rows){
      if(r[0]==="__SEC__") continue;
      const v=(+r[2]||0)*(+r[3]||0);
      const krw=(city==="pre")?v:v*state.fx;
      t[r[5]||"기타"]=(t[r[5]||"기타"]||0)+krw;
    }
  }
  return t;
}

/* ===================== CELL SELECTION ===================== */
let selected = null; // {tableId, row, col}
function selectCell(td){
  if(selected) {
    const old = document.querySelector(`#${selected.tableId} .selected`);
    if(old) old.classList.remove("selected");
  }
  td.classList.add("selected");
  const tableId = td.closest("table").id;
  const row = +td.dataset.r, col = +td.dataset.c;
  selected = {tableId, row, col};
  $("#nameBox").textContent = COL(col) + (row+1);
  const txt = td.dataset.raw ?? td.textContent.trim();
  $("#formulaInput").textContent = txt;
  $("#cellStat").innerHTML = `선택: <b>${COL(col)}${row+1}</b> · ${td.dataset.label || ""}`;
}

/* ===================== TABLE BUILDERS ===================== */
function buildExpenseSheet(tableId, city, headerLabel) {
  const tbl = $("#"+tableId);
  tbl.innerHTML = "";
  const isPre = city === "pre";
  const cur   = isPre ? "KRW" : "AUD";
  const other = isPre ? "AUD" : "KRW";
  const COLS = ["#","항목","설명",`단가(${cur})`,"수량",`소계(${cur})`,`소계(${other})`,"확정"];

  // thead with corner + col letters
  const thead = document.createElement("thead");
  const tr1 = document.createElement("tr");
  tr1.innerHTML = `<th class="corner"></th>` + COLS.map((_,i)=>`<th class="col">${COL(i)}</th>`).join("");
  thead.appendChild(tr1);
  tbl.appendChild(thead);

  const tbody = document.createElement("tbody");
  tbl.appendChild(tbody);

  let rIdx = 0;
  const push = (cells, cls="") => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="row">${rIdx+1}</td>` + cells.map((c,ci)=>{
      const cellCls = (c.cls||"") + " " + cls;
      return `<td class="cell ${cellCls}" data-r="${rIdx}" data-c="${ci}" data-label="${c.label||''}" ${c.raw!==undefined?`data-raw="${String(c.raw).replace(/"/g,'&quot;')}"`:""}>${c.html ?? c.v ?? ""}</td>`;
    }).join("");
    tbody.appendChild(tr);
    rIdx++;
    return tr;
  };

  // Title row
  push([
    {v: headerLabel, cls:"bold", label:"sheet title"},
    {v:""},{v:""},{v:""},{v:""},{v:""},{v:""},{v:""},
  ]);
  // header row
  push(COLS.map(h => ({v:h, cls:"hdr", label:"header"})), "");

  // data
  let runningAUD = 0, runningKRW = 0;
  state.tables[city].forEach((r, ri) => {
    if (r[0] === "__SEC__") {
      push([
        {v:"", cls:"section"},
        {v:r[1], cls:"section bold", label:"section"},
        {v:"", cls:"section"},{v:"", cls:"section"},{v:"", cls:"section"},
        {v:"", cls:"section"},{v:"", cls:"section"},{v:"", cls:"section"},
      ]);
      return;
    }
    const unit = +r[2]||0, qty=+r[3]||0;
    const sub  = unit*qty;
    const subOther = isPre ? sub/state.fx : sub*state.fx;
    if(isPre) runningKRW += sub; else runningAUD += sub;

    const cityTag = city==="pre"?"tag-pre":city==="syd"?"tag-syd":city==="mel"?"tag-mel":"tag-gc";

    const idx = ri+1;
    const tr = push([
      {v: idx, cls:"center muted"},
      {html:`<input type="text" value="${r[0]||""}" data-i="${ri}" data-f="0">`, cls: cityTag.replace("tag-","tag-"), label:"item", raw:r[0]||""},
      {html:`<input type="text" value="${r[1]||""}" data-i="${ri}" data-f="1">`, label:"desc", raw:r[1]||""},
      {html:`<input type="number" step="${isPre?'1':'0.01'}" value="${unit}" data-i="${ri}" data-f="2">`, cls:"num", label:"unit price", raw:unit},
      {html:`<input type="number" step="1" value="${qty}" data-i="${ri}" data-f="3">`, cls:"num", label:"qty", raw:qty},
      {v: isPre ? fmtKRW(sub) : fmtAUD(sub), cls:"num formula bold", label:"=C*D", raw:`=${COL(3)}${rIdx}*${COL(4)}${rIdx}`},
      {v: isPre ? fmtAUD(subOther) : fmtKRW(subOther), cls:"num muted", label:`환산`, raw:`=F${rIdx}${isPre?"/":"*"}FX`},
      {html:`<input type="checkbox" data-i="${ri}" data-f="4" ${r[4]?"checked":""}>`, cls:"center", label:"확정"},
    ]);
    // bind inputs
    tr.querySelectorAll("input").forEach(inp=>{
      inp.addEventListener("change", ()=>{
        const i=+inp.dataset.i, f=+inp.dataset.f;
        if(inp.type==="checkbox") state.tables[city][i][f]=inp.checked;
        else if(inp.type==="number") state.tables[city][i][f]=parseFloat(inp.value)||0;
        else state.tables[city][i][f]=inp.value;
        save(); renderSheet(city, tableId, headerLabel); recalcSummary();
      });
      inp.addEventListener("focus", e=>{ selectCell(e.target.closest("td")); });
    });
  });

  // 합계
  const t = tableTotal(city);
  push([
    {v:"", cls:"total"},
    {v:"📌 소계 (SUM)", cls:"total bold"},
    {v:"", cls:"total"},
    {v:"", cls:"total"},
    {v:"", cls:"total"},
    {v: isPre ? fmtKRW(t.krw) : fmtAUD(t.aud), cls:"total num", raw:`=SUM(${COL(5)}3:${COL(5)}${rIdx-1})`},
    {v: isPre ? fmtAUD(t.krw/state.fx) : fmtKRW(t.aud*state.fx), cls:"total num"},
    {v:"", cls:"total"},
  ]);

  // 합계(원화 환산)
  if (!isPre) {
    push([
      {v:"", cls:"grand"},
      {v:"💰 원화 환산 합계", cls:"grand bold"},
      {v:"", cls:"grand"},
      {v:"", cls:"grand"},
      {v:"", cls:"grand"},
      {v:"", cls:"grand"},
      {v: fmtKRW(t.aud*state.fx), cls:"grand num"},
      {v:"", cls:"grand"},
    ]);
  }

  // 셀 클릭 핸들러
  tbl.querySelectorAll("td.cell").forEach(td=>{
    td.addEventListener("click", e=>{
      if (e.target.tagName === "INPUT") return;
      selectCell(td);
    });
    td.addEventListener("dblclick", e=>{
      const inp = td.querySelector("input");
      if (inp) { inp.focus(); inp.select?.(); }
    });
  });
}

function renderSheet(city, tableId, headerLabel){
  buildExpenseSheet(tableId, city, headerLabel);
}

    tr.innerHTML = `<td class="row">${r+1}</td>` + cells.map((c,ci)=>`<td class="cell ${c.cls||''}" data-r="${r}" data-c="${ci}" data-label="${c.label||''}" ${c.raw!==undefined?`data-raw="${String(c.raw).replace(/"/g,'&quot;')}"`:""}>${c.html ?? c.v ?? ""}</td>`).join("");
    tbody.appendChild(tr); r++; return tr;
  };
  push([{v:"호주 15일 일정 & 일일 한도", cls:"bold"},{v:""},{v:""},{v:""},{v:""},{v:""},{v:""}]);
  push(COLS.map(h=>({v:h,cls:"hdr"})));

  const sydT=tableTotal("syd"), melT=tableTotal("mel"), gcT=tableTotal("gc");
  const cap = { SYD:sydT.aud/7, MEL:melT.aud/5, GC:gcT.aud/5 };

  DAYS.forEach((d, i)=>{
    const cityCls = d[2]==="SYD"||d[2]==="→MEL" ? "tag-syd" :
                    d[2]==="MEL"||d[2]==="→GC"  ? "tag-mel" :
                    d[2]==="GC" ? "tag-gc" : "tag-move";
    const isMoveDay = d[2].startsWith("→");
    let c = 0;
    if (d[2].includes("SYD")) c = cap.SYD;
    else if (d[2].includes("MEL") || d[2]==="→MEL") c = cap.MEL;
    else if (d[2].includes("GC")  || d[2]==="→GC")  c = cap.GC;
    const use = +state.dayUse[i]||0;
    const diff = c - use;
    const tr = push([
      {v:d[0], cls:"center bold"},
      {v:d[1], cls:"center"},
      {v:d[2], cls:`center bold ${cityCls}`},
      {v:d[3], cls:"note"},
      {v:c?fmtAUD(c):"—", cls:"num muted"},
      {html:`<input type="number" step="0.01" value="${use}" data-i="${i}">`, cls:"num formula"},
      {v:c?fmtAUD(diff):"—", cls:`num bold ${diff<0?'':''}`},
    ]);
    if (c) {
      const dcell = tr.children[7];
      dcell.style.color = diff < 0 ? "#cc0000" : "#0f7b3d";
    }
    tr.querySelector("input")?.addEventListener("change", e=>{
      state.dayUse[i] = parseFloat(e.target.value)||0;
      save(); buildItinerary(); recalcSummary();
    });
  });

  const totalUse = state.dayUse.reduce((a,b)=>a+(+b||0),0);
  const totalCap = sydT.aud + melT.aud + gcT.aud;
  push([
    {v:"", cls:"total"},
    {v:"", cls:"total"},
    {v:"📌 합계", cls:"total bold center"},
    {v:"15일", cls:"total"},
    {v:fmtAUD(totalCap), cls:"total num"},
    {v:fmtAUD(totalUse), cls:"total num"},
    {v:fmtAUD(totalCap-totalUse), cls:"total num"},
  ]);

  tbl.querySelectorAll("td.cell").forEach(td=>{
    td.addEventListener("click", e=>{
      if(e.target.tagName==="INPUT") return;
      selectCell(td);
    });
  });
}

  $("#stDay").textContent   = fmtKRW(totalKRW/15);
  $("#stReserve").textContent = fmtKRW(totalKRW*0.1);

  drawCharts(preT, sydT, melT, gcT, totalKRW);
}

/* ===================== CHECKLIST SHEET ===================== */
function buildChecklist(){
  const tbl=$("#tbl-chk"); tbl.innerHTML="";
  const COLS=["#","✔","카테고리","항목"];
  const thead=document.createElement("thead");
  thead.innerHTML=`<tr><th class="corner"></th>${COLS.map((_,i)=>`<th class="col">${COL(i)}</th>`).join("")}</tr>`;
  tbl.appendChild(thead);
  const tbody=document.createElement("tbody"); tbl.appendChild(tbody);
  let r=0;
  const push=(cells)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td class="row">${r+1}</td>`+cells.map((c,ci)=>`<td class="cell ${c.cls||''}" data-r="${r}" data-c="${ci}">${c.html ?? c.v ?? ""}</td>`).join("");
    tbody.appendChild(tr); r++; return tr;
  };
  push([{v:"체크리스트 · Pre-departure",cls:"bold"},{v:""},{v:""},{v:""}]);
  push(COLS.map(h=>({v:h,cls:"hdr"})));

  let n=0;
  CHK.forEach(([cat, items])=>{
    push([{v:"",cls:"section"},{v:"",cls:"section"},{v:cat,cls:"section bold"},{v:"",cls:"section"}]);
    items.forEach(it=>{
      const key = `${cat}|${it}`;
      const checked = !!state.checks[key];
      const tr = push([
        {v:"", cls:"muted center"},
        {html:`<input type="checkbox" ${checked?"checked":""} data-k="${key}">`, cls:"center"},
        {v:cat, cls:"muted"},
        {v:it, cls:"note " + (checked?'muted':''), html: checked? `<s>${it}</s>` : it},
      ]);
      tr.querySelector("input").addEventListener("change", e=>{
        state.checks[key]=e.target.checked; save(); buildChecklist();
      });
      n++;
    });
  });

  const done = Object.values(state.checks).filter(Boolean).length;
  push([
    {v:"", cls:"total"},
    {v:"", cls:"total"},
    {v:"진행률", cls:"total bold"},
    {v:`${done} / ${n}  (${n? Math.round(done/n*100):0}%)`, cls:"total bold"},
  ]);

  tbl.querySelectorAll("td.cell").forEach(td=>td.addEventListener("click",()=>selectCell(td)));
}

/* ===================== CHARTS ===================== */
let cCat, cCity;
function drawCharts(preT, sydT, melT, gcT, totalKRW){
  const cats = categoryTotals();
  const labels = Object.keys(cats);
  const data = labels.map(l=>cats[l]);
  const palette = ["#217346","#3d85c6","#8e7cc3","#e69138","#cc4125","#6aa84f","#a64d79","#674ea7","#990000","#0b5394","#999"];
  if(!cCat){
    cCat = new Chart($("#chartCat"), {
      type:"bar",
      data:{labels, datasets:[{data, backgroundColor:palette}]},
      options:{plugins:{legend:{display:false}, tooltip:{callbacks:{label:(c)=>fmtKRW(c.parsed.y)}}},
        scales:{y:{ticks:{callback:(v)=>fmt(v/10000)+"만"}}}}
    });
  } else { cCat.data.labels=labels; cCat.data.datasets[0].data=data; cCat.update(); }

  const cityLabels=["출국 전","시드니","멜버른","골드코스트"];
  const cityData=[preT.krw, sydT.aud*state.fx, melT.aud*state.fx, gcT.aud*state.fx];
  if(!cCity){
    cCity = new Chart($("#chartCity"),{
      type:"doughnut",
      data:{labels:cityLabels, datasets:[{data:cityData, backgroundColor:["#6aa84f","#3d85c6","#8e7cc3","#e69138"]}]},
      options:{plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}, tooltip:{callbacks:{label:(c)=>c.label+" "+fmtKRW(c.parsed)+` (${(c.parsed/totalKRW*100).toFixed(1)}%)`}}}}
    });
  } else { cCity.data.datasets[0].data=cityData; cCity.update(); }
}

/* ===================== TABS ===================== */
function activateTab(name){
  state.activeTab = name; save();
  $$(".tab").forEach(t=>t.classList.toggle("active", t.dataset.tab===name));
  $$(".pane").forEach(p=>p.classList.toggle("active", p.dataset.pane===name));
  // re-render dynamic
  if(name==="iti") buildItinerary();
  if(name==="sum") buildSummary();
  if(name==="chk") buildChecklist();
}
$$(".tab").forEach(t=>t.addEventListener("click",()=>activateTab(t.dataset.tab)));

/* ===================== RECALC ===================== */
function recalcSummary(){
  if($(`.pane[data-pane="sum"]`).classList.contains("active")) buildSummary();
  if($(`.pane[data-pane="iti"]`).classList.contains("active")) buildItinerary();
  // status always update
  const preT=tableTotal("pre"), sydT=tableTotal("syd"), melT=tableTotal("mel"), gcT=tableTotal("gc");
  const totalKRW = preT.krw + (sydT.aud+melT.aud+gcT.aud)*state.fx;
  $("#stTotal").textContent = fmtKRW(totalKRW);
  $("#stPer").textContent   = fmtKRW(totalKRW/state.people);
  $("#stDay").textContent   = fmtKRW(totalKRW/15);
  $("#stReserve").textContent = fmtKRW(totalKRW*0.1);
}

/* ===================== CONTROLS ===================== */
$("#fxRate").value = state.fx;
$("#people").value = state.people;
$("#fxRate").addEventListener("change", e=>{
  state.fx = parseFloat(e.target.value)||DEFAULT_FX; save(); renderAll();
});
$("#people").addEventListener("change", e=>{
  state.people = parseInt(e.target.value)||1; save(); recalcSummary();
});
$("#resetBtn").addEventListener("click", ()=>{
  if(!confirm("모든 값을 기본값으로 되돌릴까요?")) return;
  localStorage.removeItem(LS); location.reload();
});
$("#exportBtn").addEventListener("click", ()=>{
  const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `호주여행_예산_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
});
$("#importBtn").addEventListener("click", ()=>$("#importFile").click());
$("#importFile").addEventListener("change", async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const s=JSON.parse(await f.text());
    if(!s.tables) throw new Error("invalid");
    state=s; save(); location.reload();
  }catch(err){ alert("불러오기 실패: "+err.message); }
});

/* ===================== KEYBOARD NAV ===================== */
document.addEventListener("keydown", e=>{
  if(!selected) return;
  if(["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) return;
  const tbl = document.getElementById(selected.tableId);
  let {row, col} = selected;
  if(e.key==="ArrowDown") row++;
  else if(e.key==="ArrowUp") row--;
  else if(e.key==="ArrowRight"||e.key==="Tab") col++;
  else if(e.key==="ArrowLeft") col--;
  else return;
  e.preventDefault();
  const next = tbl.querySelector(`td.cell[data-r="${row}"][data-c="${col}"]`);
  if(next) selectCell(next);
});

/* ===================== INITIAL RENDER ===================== */
function renderAll(){
  renderSheet("pre","tbl-pre", "🇰🇷 출국 전 비용 (한국 결제 · KRW 기준)");
  renderSheet("syd","tbl-syd", "🇦🇺 시드니 (6박 7일 · AUD 기준)");
  renderSheet("mel","tbl-mel", "🇦🇺 멜버른 (4박 5일 · AUD 기준)");
  renderSheet("gc", "tbl-gc",  "🇦🇺 골드코스트 (4박 5일 · AUD 기준)");
  buildItinerary();
  buildSummary();
  buildChecklist();
  activateTab(state.activeTab || "sum");
  recalcSummary();
}
renderAll();
</script>
